<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ocuri Trail</title>
<meta name="description" content="Entrenamiento de fuerza para trail running — Ocuri Trail">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap">
<style>
/* ── TOKENS ── */
:root {
  --bg:           #F5F3EE;
  --bg-card:      #FFFFFF;
  --bg-surface:   #EEEBE4;
  --fg:           #1A1A18;
  --fg-mid:       #5A574F;
  --fg-muted:     #8C8880;
  --accent:       #3D6B41;
  --accent-light: #E8F0E8;
  --accent-warm:  #B85C28;
  --accent-ai:    #6B3DAF;
  --accent-ai-light: #F0EAF8;
  --border:       #D8D4CB;
  --tag-bg:       #EBE8E1;
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151613; --bg-card: #1E201C; --bg-surface: #252720;
    --fg: #F0EDE6; --fg-mid: #A8A49C; --fg-muted: #6E6A63;
    --accent: #5A9960; --accent-light: #1E2E1F;
    --accent-warm: #C96E3A; --accent-ai: #9B6DD4; --accent-ai-light: #221A2E;
    --border: #333530; --tag-bg: #2A2C26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151613; --bg-card: #1E201C; --bg-surface: #252720;
  --fg: #F0EDE6; --fg-mid: #A8A49C; --fg-muted: #6E6A63;
  --accent: #5A9960; --accent-light: #1E2E1F;
  --accent-warm: #C96E3A; --accent-ai: #9B6DD4; --accent-ai-light: #221A2E;
  --border: #333530; --tag-bg: #2A2C26;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; font-family: 'Barlow', system-ui, sans-serif;
  background: var(--bg); color: var(--fg); font-size: 16px; line-height: 1.5;
}
body {
  padding-left: max(0px, env(safe-area-inset-left,0px));
  padding-right: max(0px, env(safe-area-inset-right,0px));
  display: flex; flex-direction: column; min-height: 100%;
}

/* ── HEADER ── */
.app-header {
  background: var(--accent); color: #fff;
  padding: 14px max(20px,env(safe-area-inset-left,0px)) 14px max(20px,env(safe-area-inset-right,0px));
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: env(safe-area-inset-top,0px); z-index: 20;
}
.header-logo {
  width: 36px; height: 36px; background: rgba(255,255,255,0.2);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed',sans-serif; font-weight: 900; font-size: 18px;
  letter-spacing: -0.5px; flex-shrink: 0;
}
.header-text h1 {
  font-family: 'Barlow Condensed',sans-serif; font-weight: 900;
  font-size: 1.25rem; letter-spacing: 0.5px; text-transform: uppercase; line-height: 1;
}
.header-text p { font-size: 0.72rem; opacity: 0.8; letter-spacing: 0.3px; text-transform: uppercase; }
.header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.header-btn {
  background: rgba(255,255,255,0.2); border: none; color: #fff;
  border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: background 0.2s;
}
.header-btn:hover { background: rgba(255,255,255,0.3); }

/* ── TABS ── */
.app-tabs {
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  display: flex; gap: 0; padding: 0 20px;
}
.tab-btn {
  padding: 12px 18px; border: none; background: transparent;
  font-family: 'Barlow Condensed',sans-serif; font-weight: 700; font-size: 0.95rem;
  letter-spacing: 0.5px; text-transform: uppercase; color: var(--fg-muted);
  cursor: pointer; border-bottom: 3px solid transparent; transition: color 0.15s, border-color 0.15s;
  display: flex; align-items: center; gap: 7px; white-space: nowrap;
}
.tab-btn:hover { color: var(--fg-mid); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn .tab-badge {
  background: var(--accent-warm); color: #fff;
  font-size: 0.65rem; font-weight: 700; padding: 1px 6px;
  border-radius: 100px; min-width: 18px; text-align: center;
}
.tab-btn.tab-fav.active { color: var(--accent-warm); border-bottom-color: var(--accent-warm); }

/* ── LAYOUT ── */
.app-body { display: flex; flex: 1; min-height: 0; }
.sidebar {
  width: 220px; flex-shrink: 0; background: var(--bg-surface);
  border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto;
}
.sidebar-section { padding: 16px 12px 8px; }
.sidebar-label {
  font-family: 'Barlow Condensed',sans-serif; font-size: 0.7rem; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; color: var(--fg-muted);
  padding: 0 4px; margin-bottom: 6px;
}
.muscle-btn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 10px 12px; border-radius: var(--r-md); border: none;
  background: transparent; color: var(--fg-mid);
  font-family: 'Barlow',sans-serif; font-size: 0.9rem; font-weight: 500;
  cursor: pointer; text-align: left; transition: background 0.15s, color 0.15s; margin-bottom: 2px;
}
.muscle-btn:hover { background: var(--accent-light); color: var(--accent); }
.muscle-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
.muscle-btn .m-icon { font-size: 1.1rem; width: 22px; text-align: center; flex-shrink: 0; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }

/* ── PROFILE BAR ── */
.profile-bar {
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  padding: 14px max(20px,env(safe-area-inset-right,0px)) 14px 20px;
  display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
}
.profile-field { display: flex; flex-direction: column; gap: 4px; min-width: 80px; }
.profile-field label {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px;
  text-transform: uppercase; color: var(--fg-muted);
}
.profile-field input, .profile-field select {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--fg);
  font-family: 'Barlow',sans-serif; font-size: 0.9rem;
  padding: 7px 10px; outline: none; transition: border-color 0.15s; min-width: 0;
}
.profile-field input:focus, .profile-field select:focus { border-color: var(--accent); }
.profile-field input[type="number"] { width: 80px; }

.bar-btns { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.btn-generar {
  background: var(--accent-warm); color: #fff; border: none;
  border-radius: var(--r-md); padding: 9px 20px;
  font-family: 'Barlow Condensed',sans-serif; font-weight: 700;
  font-size: 1rem; letter-spacing: 0.5px; text-transform: uppercase;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s; white-space: nowrap;
}
.btn-generar:hover { opacity: 0.9; }
.btn-generar:active { transform: scale(0.98); }
.btn-generar:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-ia {
  background: var(--accent-ai); color: #fff; border: none;
  border-radius: var(--r-md); padding: 9px 18px;
  font-family: 'Barlow Condensed',sans-serif; font-weight: 700;
  font-size: 1rem; letter-spacing: 0.5px; text-transform: uppercase;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s; white-space: nowrap;
  display: flex; align-items: center; gap: 7px;
}
.btn-ia:hover { opacity: 0.9; }
.btn-ia:active { transform: scale(0.98); }
.btn-ia:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ia .ia-spinner {
  width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4);
  border-top-color: #fff; border-radius: 50%;
  animation: spin 0.7s linear infinite; display: none;
}
.btn-ia.loading .ia-spinner { display: block; }
.btn-ia.loading .ia-label { opacity: 0.7; }

@keyframes spin { to { transform: rotate(360deg); } }

/* ── CONTENT ── */
.content-area { flex: 1; padding: 24px 20px; padding-right: max(20px,env(safe-area-inset-right,0px)); }

.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 320px; text-align: center; gap: 12px;
}
.empty-icon { font-size: 3rem; opacity: 0.3; }
.empty-state h2 {
  font-family: 'Barlow Condensed',sans-serif; font-weight: 700;
  font-size: 1.3rem; color: var(--fg-mid); text-wrap: balance;
}
.empty-state p { color: var(--fg-muted); font-size: 0.9rem; max-width: 300px; text-wrap: balance; }

/* ── PROGRAMA HEADER ── */
.programa-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
}
.programa-titulo {
  font-family: 'Barlow Condensed',sans-serif; font-weight: 900;
  font-size: 1.8rem; text-transform: uppercase; line-height: 1; color: var(--fg);
}
.programa-titulo span { color: var(--accent); }
.programa-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.meta-tag {
  background: var(--tag-bg); color: var(--fg-mid); font-size: 0.75rem;
  font-weight: 600; letter-spacing: 0.3px; padding: 3px 10px;
  border-radius: 100px; border: 1px solid var(--border);
}
.meta-tag.ia-tag {
  background: var(--accent-ai-light); color: var(--accent-ai);
  border-color: var(--accent-ai);
}

/* ── GRID EJERCICIOS ── */
.ejercicios-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 16px; }

.ejercicio-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--r-lg); overflow: hidden;
  display: flex; flex-direction: column; transition: box-shadow 0.2s;
  position: relative;
}
.ejercicio-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.ejercicio-card.ia-card { border-color: var(--accent-ai); }

/* ── THUMBNAIL ── */
.card-video-thumb {
  position: relative; aspect-ratio: 16/9;
  background: var(--bg-surface); cursor: pointer; overflow: hidden; flex-shrink: 0;
}
.card-video-thumb img {
  width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s;
}
.card-video-thumb:hover img { transform: scale(1.04); }
.card-video-placeholder {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--accent) 0%, #1e3d21 100%); font-size: 3rem;
}
.card-video-thumb.has-error .card-video-placeholder { display: flex; }
.card-video-thumb.has-error img { display: none; }
.card-video-thumb.ia-thumb .card-video-placeholder {
  background: linear-gradient(135deg, var(--accent-ai) 0%, #2d1a4f 100%); display: flex;
}
.card-video-thumb.ia-thumb img { display: none; }
.play-overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.25); transition: background 0.2s;
}
.card-video-thumb:hover .play-overlay { background: rgba(0,0,0,0.35); }
.play-btn {
  width: 52px; height: 52px; background: rgba(255,255,255,0.95); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 16px rgba(0,0,0,0.35); transition: transform 0.15s;
}
.card-video-thumb:hover .play-btn { transform: scale(1.08); }
.play-btn svg { width: 20px; height: 20px; fill: #FF0000; margin-left: 3px; }
.card-num {
  position: absolute; top: 10px; left: 10px; background: var(--accent); color: #fff;
  font-family: 'Barlow Condensed',sans-serif; font-weight: 700;
  font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.5px;
}
.card-num.ia-num { background: var(--accent-ai); }
.card-yt-hint {
  position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.65); color: #fff;
  font-size: 0.65rem; font-weight: 600; letter-spacing: 0.3px;
  padding: 3px 8px; border-radius: 4px; display: none;
}
@media (hover: none) { .card-yt-hint { display: block; } }

/* ── CARD BODY ── */
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.card-nombre {
  font-family: 'Barlow Condensed',sans-serif; font-weight: 700;
  font-size: 1.1rem; line-height: 1.2; color: var(--fg); text-wrap: balance;
}
.card-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
.stat-box { background: var(--bg-surface); border-radius: var(--r-sm); padding: 8px 6px; text-align: center; }
.stat-val {
  font-family: 'Barlow Condensed',sans-serif; font-weight: 700;
  font-size: 1.2rem; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums;
}
.stat-lbl { font-size: 0.65rem; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
.card-tip { font-size: 0.8rem; color: var(--fg-muted); line-height: 1.4; padding-top: 4px; border-top: 1px solid var(--border); }
.card-link {
  display: flex; align-items: center; gap: 6px; color: var(--accent);
  font-size: 0.82rem; font-weight: 600; text-decoration: none; padding-top: 2px;
}
.card-link:hover { text-decoration: underline; }
.card-link svg { width: 14px; height: 14px; flex-shrink: 0; }

/* ── CARD ACTIONS (rotar + favorito) ── */
.card-actions {
  display: flex; gap: 8px; padding: 0 16px 14px; margin-top: -4px;
}
.btn-rotar, .btn-fav {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg-surface);
  color: var(--fg-mid); font-family: 'Barlow Condensed',sans-serif;
  font-size: 0.8rem; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase;
  padding: 7px 10px; cursor: pointer; transition: all 0.15s;
}
.btn-rotar:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.btn-rotar:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-fav:hover { background: #FFF3E0; color: var(--accent-warm); border-color: var(--accent-warm); }
.btn-fav.active { background: #FFF3E0; color: var(--accent-warm); border-color: var(--accent-warm); }
.btn-fav.active .fav-icon::before { content: '★'; }
.btn-fav:not(.active) .fav-icon::before { content: '☆'; }

/* ── IA CARD ESPECIAL ── */
.ia-tip-box {
  background: var(--accent-ai-light); border-radius: var(--r-sm);
  padding: 10px 12px; font-size: 0.8rem; color: var(--fg-mid); line-height: 1.5;
  border-left: 3px solid var(--accent-ai);
}
.ia-label-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--accent-ai-light); color: var(--accent-ai);
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
  padding: 2px 8px; border-radius: 100px; border: 1px solid var(--accent-ai);
}

/* ── RESUMEN ── */
.resumen-bloque {
  background: var(--accent-light); border: 1px solid var(--accent);
  border-radius: var(--r-md); padding: 14px 18px; margin-top: 20px;
  display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
}
.r-item { text-align: center; }
.r-val { font-family: 'Barlow Condensed',sans-serif; font-weight: 900; font-size: 1.6rem; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.r-lbl { font-size: 0.72rem; color: var(--fg-mid); text-transform: uppercase; letter-spacing: 0.5px; }
.r-sep { flex: 1; min-width: 0; font-size: 0.88rem; color: var(--fg-mid); line-height: 1.5; }

/* ── FAVORITOS TAB ── */
.favs-empty {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 280px; text-align: center; gap: 12px;
}
.favs-empty .empty-icon { font-size: 2.5rem; opacity: 0.25; }
.favs-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
}
.favs-titulo {
  font-family: 'Barlow Condensed',sans-serif; font-weight: 900;
  font-size: 1.5rem; text-transform: uppercase; color: var(--fg);
}
.btn-clear-favs {
  background: transparent; border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--fg-muted); font-size: 0.8rem; font-weight: 600; padding: 6px 12px;
  cursor: pointer; transition: all 0.15s;
}
.btn-clear-favs:hover { border-color: #e53935; color: #e53935; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-box {
  background: var(--bg-card); border-radius: var(--r-lg);
  width: 100%; max-width: 700px; overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  transform: translateY(20px); transition: transform 0.25s;
}
.modal-overlay.open .modal-box { transform: translateY(0); }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.modal-title { font-family: 'Barlow Condensed',sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--fg); }
.modal-close {
  background: var(--bg-surface); border: none; border-radius: 50%;
  width: 32px; height: 32px; cursor: pointer; color: var(--fg-mid);
  font-size: 18px; display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--border); }
.modal-video { position: relative; aspect-ratio: 16/9; background: #000; }
.modal-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
.modal-video-actions {
  display: flex; gap: 10px; padding: 14px 18px;
  border-top: 1px solid var(--border); background: var(--bg-surface);
}
.btn-yt, .btn-yt-search {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: var(--r-md); padding: 12px 16px;
  font-family: 'Barlow Condensed',sans-serif; font-weight: 700;
  font-size: 1rem; letter-spacing: 0.5px; text-transform: uppercase;
  cursor: pointer; text-decoration: none; transition: opacity 0.15s; color: #fff;
}
.btn-yt { background: #FF0000; }
.btn-yt:hover { opacity: 0.88; }
.btn-yt-search { background: var(--accent-warm); }
.btn-yt-search:hover { opacity: 0.88; }

/* ── SKELETON / LOADING ── */
.skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 16px; }
.skeleton-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--r-lg); overflow: hidden;
}
.skeleton-thumb { aspect-ratio: 16/9; background: var(--bg-surface); position: relative; overflow: hidden; }
.skeleton-body { padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.skeleton-line {
  height: 14px; background: var(--bg-surface); border-radius: 4px;
  position: relative; overflow: hidden;
}
.skeleton-line::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ── MOBILE ── */
@media (max-width: 640px) {
  .sidebar { display: none; }
  .mobile-muscle-select { display: block !important; }
  .profile-bar { gap: 8px; padding: 12px 16px; }
  .content-area { padding: 16px; }
  .ejercicios-grid, .skeleton-grid { grid-template-columns: 1fr; }
  .modal-video-actions { flex-direction: column; }
  .app-tabs { padding: 0 10px; }
  .tab-btn { padding: 10px 12px; font-size: 0.85rem; }
}
.mobile-muscle-select { display: none; }
.mobile-muscle-select { background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 10px max(16px,env(safe-area-inset-right,0px)) 10px 16px; }
.mobile-muscle-select select {
  width: 100%; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--fg);
  font-family: 'Barlow',sans-serif; font-size: 0.95rem; padding: 9px 12px; outline: none;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-logo">OT</div>
  <div class="header-text">
    <h1>Ocuri Trail</h1>
    <p>Entrenamiento de fuerza para trail</p>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="toggleTheme()" aria-label="Cambiar tema" title="Cambiar tema">☾</button>
  </div>

/* ═══════════════════════════════════════════════
   ROTACIÓN SIN REPETIR
═══════════════════════════════════════════════ */
function pickEjercicios(musculoId, count = 6) {
  if (!sessionUsed[musculoId]) sessionUsed[musculoId] = new Set();
  const pool    = EJERCICIOS[musculoId];
  const used    = sessionUsed[musculoId];
  let available = pool.filter(e => !used.has(e.nombre));
  // Si no hay suficientes sin usar, resetear
  if (available.length < count) {
    used.clear();
    available = [...pool];
  }
  // Mezclar y seleccionar
  const shuffled = available.sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, count);
  selected.forEach(e => used.add(e.nombre));
  return selected;
}

function rotarEjercicio(index) {
  if (!musculoActivo) return;
  if (!sessionUsed[musculoActivo]) sessionUsed[musculoActivo] = new Set();
  const pool      = EJERCICIOS[musculoActivo];
  const usedNames = new Set(currentCards.map(e => e.nombre));
  let candidates  = pool.filter(e => !usedNames.has(e.nombre) && !sessionUsed[musculoActivo].has(e.nombre));
  if (!candidates.length) {
    // Resetear solo los no actuales
    candidates = pool.filter(e => !usedNames.has(e.nombre));
  }
  if (!candidates.length) return; // solo 6 o menos ejercicios en total
  const nuevo = candidates[Math.floor(Math.random() * candidates.length)];
  sessionUsed[musculoActivo].add(nuevo.nombre);
  currentCards[index] = nuevo;

  // Re-renderizar esa card
  const nivel    = document.getElementById('nivel').value;
  const objetivo = document.getElementById('objetivo').value;
  const [series, reps] = calcularSeries(nivel, objetivo);
  const descanso = calcularDescanso(objetivo);
  const musculo  = MUSCULOS.find(m => m.id === musculoActivo);
  const grid     = document.getElementById('ejerciciosGrid');
  const cards    = grid.querySelectorAll('.ejercicio-card');
  if (cards[index]) {
    const newCard = buildCard(nuevo, index, series, reps, descanso, musculo, false);
    cards[index].replaceWith(newCard);
  }
}

═══════════════════════════════════════════════ */
function buildCard(ej, i, series, reps, descanso, musculo, isIA) {
  const ytUrl     = getYtUrl(ej.videoId || '');
  const searchUrl = getSearchUrl(ej.nombre);
  const hasVideo  = !!ej.videoId;
  const pool      = EJERCICIOS[musculoActivo] || [];
  const canRotate = pool.length > (currentCards.length);

  const card = document.createElement('div');
  card.className = 'ejercicio-card' + (isIA ? ' ia-card' : '');

  const thumbClass = isIA || !hasVideo ? 'card-video-thumb ia-thumb' : 'card-video-thumb';
  const numClass   = isIA ? 'card-num ia-num' : 'card-num';
  const imgHtml    = hasVideo
    ? `<img src="${getThumbnail(ej.videoId)}" alt="${ej.nombre}" loading="lazy" onerror="this.closest('.card-video-thumb').classList.add('has-error')">`
    : '';
  const linkHtml   = hasVideo
    ? `<a class="card-link" href="${ytUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l5-5M10 4h10v10M12 14l-8 8"/></svg>
         Ver en YouTube · ${ej.canal || 'YouTube'}
       </a>`
    : `<a class="card-link" href="${searchUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
         Buscar vídeo en YouTube
       </a>`;

  const iaBadge = isIA ? `<span class="ia-label-badge">✦ IA</span>` : '';
  const tipHtml = isIA
    ? `<div class="ia-tip-box">${ej.tip}</div>`
    : `<div class="card-tip">${ej.tip}</div>`;

  const nombre_esc = ej.nombre.replace(/"/g,'&quot;');
  const favActive  = isFav(ej.nombre) ? 'active' : '';

  card.innerHTML = `
    <div class="${thumbClass}"
         onclick="${hasVideo ? `abrirVideo('${ej.videoId}','${ej.nombre.replace(/'/g,"\\'")}')` : `window.open('${searchUrl}','_blank')`}"
         role="button" tabindex="0" aria-label="Ver vídeo de ${ej.nombre}">
      ${imgHtml}
      <div class="card-video-placeholder">${musculo.icon}</div>
      <div class="play-overlay"><div class="play-btn">
        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      </div></div>
      <span class="${numClass}">Ej. ${i+1}</span>
      <span class="card-yt-hint">▶ Abre YouTube</span>
    </div>
    <div class="card-body">
      <div class="card-nombre">${ej.nombre} ${iaBadge}</div>
      <div class="card-stats">
        <div class="stat-box"><div class="stat-val">${series}</div><div class="stat-lbl">Series</div></div>
        <div class="stat-box"><div class="stat-val">${reps}</div><div class="stat-lbl">Reps</div></div>
        <div class="stat-box"><div class="stat-val">${descanso.replace(' seg','s')}</div><div class="stat-lbl">Descanso</div></div>
      </div>
      ${tipHtml}
      ${linkHtml}
    </div>
    <div class="card-actions">
      <button class="btn-rotar" onclick="rotarEjercicio(${i})" title="Rotar por otro ejercicio" ${!canRotate?'disabled':''}>↻ Rotar</button>
      <button class="btn-fav ${favActive}" data-nombre="${nombre_esc}"
              onclick='toggleFav(${JSON.stringify(ej).replace(/'/g,"&#39;")})'
              title="${isFav(ej.nombre)?'Quitar de favoritos':'Añadir a favoritos'}">
        <span class="fav-icon"></span> Favorito
      </button>
    </div>
  `;
  return card;
}

/* ═══════════════════════════════════════════════
   GENERAR PROGRAMA (local o IA)
═══════════════════════════════════════════════ */
async function generarPrograma(useIA) {
  if (!musculoActivo) {
    alert('Por favor, selecciona primero un grupo muscular en el menú lateral.');
    return;
  }
  const edad    = parseInt(document.getElementById('edad').value) || 35;
  const peso    = parseInt(document.getElementById('peso').value) || 70;
  const nivel   = document.getElementById('nivel').value;
  const objetivo= document.getElementById('objetivo').value;
  const musculo = MUSCULOS.find(m => m.id === musculoActivo);

  const [series, reps] = calcularSeries(nivel, objetivo);
  const descanso = calcularDescanso(objetivo);
  const vol      = calcularVolumen(nivel);

  const ajusteEdad = edad>50 ? '⚠️ Mayor de 50: descansa 20s extra entre series.' :
                     edad<25 ? '✅ Edad óptima: puedes acortar el descanso 10s.' : '';
  const ajustePeso = peso<60 ? 'Usa mancuernas más ligeras (2-5 kg). Prioriza la técnica.' :
                     peso>90 ? 'Con más masa, reduce repeticiones en salto y aumenta control excéntrico.' :
                     'Peso estándar. Progresa 0,5 kg por semana en ejercicios con mancuernas.';

  document.getElementById('emptyState').hidden = true;
  const area = document.getElementById('programaArea');
  area.hidden = false;

  const nivelLabel    = {principiante:'Principiante',intermedio:'Intermedio',avanzado:'Avanzado'}[nivel];
  const objetivoLabel = {fuerza:'Fuerza',resistencia:'Resistencia-muscular',estabilidad:'Estabilidad'}[objetivo];
  const iaTagHtml     = useIA ? `<span class="meta-tag ia-tag">✦ Generado por IA</span>` : '';

  area.innerHTML = `
    <div class="programa-header">
      <div>
        <div class="programa-titulo">${musculo.icon} <span>${musculo.label}</span></div>
        <div class="programa-meta">
          <span class="meta-tag">${nivelLabel}</span>
          <span class="meta-tag">${objetivoLabel}</span>
          <span class="meta-tag">${edad} años · ${peso} kg</span>
          <span class="meta-tag">${vol}</span>
          ${iaTagHtml}
        </div>
      </div>
    </div>
    <div class="ejercicios-grid" id="ejerciciosGrid"></div>
    <div class="resumen-bloque">
      <div class="r-item"><div class="r-val" id="rEjercicios">6</div><div class="r-lbl">Ejercicios</div></div>
      <div class="r-item"><div class="r-val">${series}</div><div class="r-lbl">Series</div></div>
      <div class="r-item"><div class="r-val">${reps}</div><div class="r-lbl">Reps</div></div>
      <div class="r-item"><div class="r-val">${descanso.split(' ')[0]}</div><div class="r-lbl">Descanso</div></div>
      <div class="r-sep">
        ${ajusteEdad ? `<strong>Nota:</strong> ${ajusteEdad}<br>` : ''}
        <strong>Carga:</strong> ${ajustePeso}
      </div>
    </div>
  `;

  area.scrollIntoView({ behavior:'smooth', block:'start' });

  if (useIA) {
    await generarConIA(musculo, nivel, objetivo, edad, peso, series, reps, descanso);
  } else {
    generarLocal(musculo, nivel, objetivo, series, reps, descanso);
  }
}

function generarLocal(musculo, nivel, objetivo, series, reps, descanso) {
  const ejercs = pickEjercicios(musculo.id, 6);
  currentCards = [...ejercs];
  const grid = document.getElementById('ejerciciosGrid');
  grid.innerHTML = '';
  ejercs.forEach((ej, i) => grid.appendChild(buildCard(ej, i, series, reps, descanso, musculo, false)));
}

/* ═══════════════════════════════════════════════
   GENERACIÓN CON IA
═══════════════════════════════════════════════ */
async function generarConIA(musculo, nivel, objetivo, edad, peso, series, reps, descanso) {
  const btn = document.getElementById('btnIA');
  btn.classList.add('loading');
  btn.disabled = true;
  document.getElementById('btnIA').querySelector('.ia-label').textContent = 'Generando…';

  // Mostrar skeleton mientras carga
  const grid = document.getElementById('ejerciciosGrid');
  grid.innerHTML = Array(6).fill(0).map(() => `
    <div class="skeleton-card">
      <div class="skeleton-thumb"></div>
      <div class="skeleton-body">
        <div class="skeleton-line" style="width:75%"></div>
        <div class="skeleton-line" style="width:55%"></div>
        <div class="skeleton-line" style="width:90%"></div>
        <div class="skeleton-line" style="width:65%"></div>
      </div>
    </div>`).join('');

  const prompt = `Eres un entrenador especialista en trail running y fuerza funcional.
Genera exactamente 6 ejercicios de fuerza para el grupo muscular: ${musculo.label}.
Perfil del atleta: nivel ${nivel}, objetivo ${objetivo}, edad ${edad} años, peso ${peso}kg.
Adapta la selección y los consejos a este perfil específico.

Responde SOLO con un array JSON válido, sin markdown, sin explicaciones. Formato:
[
  {
    "nombre": "Nombre del ejercicio",
    "tip": "Consejo técnico específico para trail running (máx 120 caracteres)",
    "canal": "NombreCanal"
  }
]
Incluye ejercicios funcionales, con y sin material, apropiados para el nivel indicado.`;

  try {
    const resp = await fetch(PROXY_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-App-Token': PROXY_SECRET,
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1200,
        messages: [{ role: 'user', content: prompt }],
      }),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    const text = data?.content?.[0]?.text || '';

    // Extraer JSON del texto
    const match = text.match(/\[[\s\S]*\]/);
    if (!match) throw new Error('La IA no devolvió JSON válido');
    const iaEjercicios = JSON.parse(match[0]);

    if (!Array.isArray(iaEjercicios) || iaEjercicios.length === 0) throw new Error('Array vacío');

    // Completar con ejercicios locales si la IA devuelve menos de 6
    const filled = iaEjercicios.slice(0, 6).map(e => ({
      nombre: e.nombre || 'Ejercicio IA',
      tip:    e.tip    || '',
      canal:  e.canal  || 'IA',
      videoId: null,  // IA no genera IDs de YouTube
    }));
    while (filled.length < 6) {
      const local = pickEjercicios(musculo.id, 1)[0];
      filled.push(local);
    }

    currentCards = [...filled];
    grid.innerHTML = '';
    filled.forEach((ej, i) => grid.appendChild(buildCard(ej, i, series, reps, descanso, musculo, !ej.videoId)));
    document.getElementById('rEjercicios').textContent = filled.length;

  } catch (err) {
    // Fallback a ejercicios locales si falla la IA
    grid.innerHTML = '';
    const fallback = pickEjercicios(musculo.id, 6);
    currentCards = [...fallback];
    fallback.forEach((ej, i) => grid.appendChild(buildCard(ej, i, series, reps, descanso, musculo, false)));

    // Toast de error
    showToast(`⚠️ IA no disponible: ${err.message}. Mostrando ejercicios locales.`);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
    btn.querySelector('.ia-label').textContent = '✦ IA';
  }
}

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
function showToast(msg) {
  let t = document.getElementById('appToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'appToast';
    t.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
      background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:var(--r-md);
      font-size:0.85rem;z-index:200;max-width:90vw;text-align:center;
      box-shadow:0 4px 20px rgba(0,0,0,0.3);transition:opacity 0.3s;`;
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 4000);
}

/* ═══════════════════════════════════════════════
   FAVORITOS — RENDER TAB
═══════════════════════════════════════════════ */
function renderFavs() {
  const container = document.getElementById('favsContent');
  const list = Object.values(favs);

  if (!list.length) {
    container.innerHTML = `
      <div class="favs-empty">
        <div class="empty-icon">★</div>
        <h2>Sin favoritos todavía</h2>
        <p>Pulsa el botón ☆ Favorito en cualquier ejercicio para guardarlo aquí.</p>
      </div>`;
    return;
  }

  // Agrupar por grupo muscular
  const grupos = {};
  list.forEach(ej => {
    const g = ej._musculo || 'Otros';
    if (!grupos[g]) grupos[g] = [];
    grupos[g].push(ej);
  });

  container.innerHTML = `
    <div class="favs-header">
      <div class="favs-titulo">★ Favoritos <span style="color:var(--fg-muted);font-size:1.1rem">(${list.length})</span></div>
      <button class="btn-clear-favs" onclick="clearAllFavs()">Borrar todos</button>
    </div>
    <div class="ejercicios-grid" id="favsGrid"></div>`;

  const grid = document.getElementById('favsGrid');
  // Usar parámetros genéricos para las cards de favoritos
  list.forEach((ej, i) => {
    const musculo = MUSCULOS.find(m => m.id === ej._musculo) || { icon: '⭐', id: 'otros' };
    const card = buildFavCard(ej, musculo);
    grid.appendChild(card);
  });
}

function buildFavCard(ej, musculo) {
  const ytUrl     = ej.videoId ? getYtUrl(ej.videoId) : getSearchUrl(ej.nombre);
  const searchUrl = getSearchUrl(ej.nombre);
  const hasVideo  = !!ej.videoId;
  const nombre_esc = ej.nombre.replace(/"/g,'&quot;');

  const card = document.createElement('div');
  card.className = 'ejercicio-card';

  const thumbClass = hasVideo ? 'card-video-thumb' : 'card-video-thumb ia-thumb';
  const imgHtml    = hasVideo
    ? `<img src="${getThumbnail(ej.videoId)}" alt="${ej.nombre}" loading="lazy" onerror="this.closest('.card-video-thumb').classList.add('has-error')">`
    : '';

  card.innerHTML = `
    <div class="${thumbClass}"
         onclick="${hasVideo ? `abrirVideo('${ej.videoId}','${ej.nombre.replace(/'/g,"\\'")}')` : `window.open('${searchUrl}','_blank')`}"
         role="button" tabindex="0">
      ${imgHtml}
      <div class="card-video-placeholder">${musculo.icon}</div>
      <div class="play-overlay"><div class="play-btn">
        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      </div></div>
      <span class="card-num">${musculo.icon}</span>
    </div>
    <div class="card-body">
      <div class="card-nombre">${ej.nombre}</div>
      <div class="card-tip">${ej.tip}</div>
      <a class="card-link" href="${ytUrl}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l5-5M10 4h10v10M12 14l-8 8"/></svg>
        ${hasVideo ? `Ver en YouTube · ${ej.canal||''}` : 'Buscar en YouTube'}
      </a>
    </div>
    <div class="card-actions">
      <button class="btn-fav active" data-nombre="${nombre_esc}"
              onclick='removeFav("${favKey(ej.nombre)}")' title="Quitar de favoritos">
        <span class="fav-icon"></span> Favorito
      </button>
    </div>`;
  return card;
}

function removeFav(key) {
  delete favs[key];
  saveFavs();
  updateFavBadge();
  renderFavs();
}
function clearAllFavs() {
  if (!confirm('¿Borrar todos los favoritos?')) return;
  favs = {};
  saveFavs();
  updateFavBadge();
  renderFavs();
}

/* ═══════════════════════════════════════════════
   VÍDEO MODAL
═══════════════════════════════════════════════ */
function abrirVideo(videoId, nombre) {
  if (isMobile()) { window.open(getYtUrl(videoId), '_blank', 'noopener'); return; }
  openModal(videoId, nombre);
}
function openModal(videoId, nombre) {
  document.getElementById('modalTitle').textContent = nombre;
  document.getElementById('modalIframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
  document.getElementById('modalYtLink').href     = getYtUrl(videoId);
  document.getElementById('modalSearchLink').href = getSearchUrl(nombre);
  document.getElementById('videoModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('videoModal')) return;
  document.getElementById('videoModal').classList.remove('open');
  document.getElementById('modalIframe').src = '';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

/* ═══════════════════════════════════════════════
   TEMA
═══════════════════════════════════════════════ */
function toggleTheme() {
  const root = document.documentElement;
  const cur  = root.getAttribute('data-theme');
  const btn  = document.querySelector('.header-btn');
  if (cur==='dark')       { root.setAttribute('data-theme','light'); btn.textContent='☾'; }
  else if (cur==='light') { root.removeAttribute('data-theme');       btn.textContent='☾'; }
  else                    { root.setAttribute('data-theme','dark');   btn.textContent='☀'; }
}

init();
</script>
